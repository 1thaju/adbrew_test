services:
  api:
    build:
      context: .
    container_name: api
    command: python rest/manage.py runserver 0.0.0.0:8000
    environment:
      ENV_TYPE: staging
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/src
      - ./src/tmp:/tmp

  app:
    image: node:14-bullseye
    container_name: app
    working_dir: /src/app
    command: sh -c "yarn install && yarn start"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/src
      - app_node_modules:/src/app/node_modules

  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ./src/db:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_node_modules:
